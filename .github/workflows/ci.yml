name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify npm supports min-release-age
        run: |
          npm --version
          node -e "const { execSync } = require('node:child_process'); const [major, minor] = execSync('npm --version', { encoding: 'utf8' }).trim().split('.').map(Number); const supported = Number.isFinite(major) && Number.isFinite(minor) && (major > 11 || (major === 11 && minor >= 10)); if (!supported) { console.error('npm >= 11.10.0 is required for min-release-age support'); process.exit(1); }"

      - name: Verify project min-release-age declaration
        run: |
          node -e "const fs = require('node:fs'); const content = fs.readFileSync('.npmrc', 'utf8'); if (!/^min-release-age=90\\s*$/m.test(content)) { console.error('.npmrc must contain min-release-age=90'); process.exit(1); }"

      - name: Verify npm min-release-age policy is active
        run: |
          node -e "const { execSync } = require('node:child_process'); const before = execSync('npm config get before', { encoding: 'utf8' }).trim(); if (!before || before === 'null') { console.error('npm min-release-age policy is not active (before is null)'); process.exit(1); }"

      - name: Install dependencies
        run: npm ci

      - name: Check CommonJS export
        run: npm run smoke:cjs

      - name: Check ESM export
        run: npm run smoke:esm

name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify npm supports min-release-age
        run: |
          npm --version
          node -e "const major = Number(process.versions.npm.split('.')[0]); if (major < 11) { console.error('npm >= 11 is required for min-release-age support'); process.exit(1); }"

      - name: Verify npm min-release-age policy
        run: test "$(npm config get min-release-age)" = "90"

      - name: Install dependencies
        run: npm ci

      - name: Check CommonJS export
        run: npm run smoke:cjs

      - name: Check ESM export
        run: npm run smoke:esm
